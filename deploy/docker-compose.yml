# Velo Sim auf dem netcup-VPS, neben salon-flow, einkaufsliste & Co.
# Caddy (salonflow-prod-caddy-1) proxyt velo.tut-it.de → velo:8080 über das Netz salonflow-prod_default
# und holt das Zertifikat selbst, sobald der DNS-Eintrag auf den Server zeigt.
# Geheimnisse (POSTGRES_PASSWORD, JWT_SECRET) nur in /opt/velo-sim/.env (chmod 600), nie im Repo.
# Ausrollen: deploy/deploy.sh
name: velo-sim
services:
  velo:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: velo-sim
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://velo:${POSTGRES_PASSWORD:?}@db:5432/velo
      JWT_SECRET: ${JWT_SECRET:?}
      PUBLIC_URL: https://${VELO_DOMAIN:-velo.tut-it.de}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    networks:
      - default
      - proxy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velo
      POSTGRES_DB: velo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - velo_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U velo -d velo']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - default

volumes:
  velo_db:

networks:
  default:
  proxy:
    name: salonflow-prod_default
    external: true
